experiment_name: gemma4_e4b_v2
base_model_name: google/gemma-4-E4B-it
local_model_path: /usr/data/models/skillllm-v2/models/gemma-4-e4b-it
train_file: data/v2/train.jsonl
val_file: data/v2/val.jsonl
test_file: data/v2/test.jsonl
output_dir: outputs/gemma4_e4b_v2
prompt_template_file: src/prompts/skillspan_span_prompt.txt
fewshot_prompt_file: src/prompts/skillspan_span_prompt_fewshot.txt
max_seq_length: 2048
learning_rate: 0.0002
epochs: 3
batch_size: 4
eval_batch_size: 4
gradient_accumulation_steps: 4
lora_r: 32
