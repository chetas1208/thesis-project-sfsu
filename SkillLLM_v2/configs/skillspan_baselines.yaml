benchmark:
  dataset: skillspan
  split: test
  seed: 42
  batch_size: 1
  cache_predictions: true
  output_dir: /usr/data/models/skillllm-v2/results/skillspan_baselines
  save_raw_outputs: true
  save_normalized_predictions: true

evaluation:
  exact_span_match: true
  partial_span_match: true
  token_level_f1: true
  entity_level_f1: true
  per_label_metrics: true
  labels:
    - SKILL
    - HARD_SKILL
    - SOFT_SKILL
