[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillllm"
version = "0.1.0"
description = "Skill extraction from resumes and job postings: a Mistral-Small-3.1-24B LoRA system with span-voting ensembling, plus a model-free offline mode."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Chetas Parekh" }]
keywords = ["skill extraction", "information extraction", "NER", "LoRA", "resume", "job postings", "SkillSpan"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The offline (dictionary) path, the ensemble layer, the CLI and the result types use the standard library only.
dependencies = []

[project.optional-dependencies]
# Required to load the Mistral base model + LoRA adapters (4-bit quantization needs a CUDA GPU).
model = [
    "torch>=2.1",
    "transformers>=4.50",
    "peft>=0.11",
    "bitsandbytes>=0.43",
    "accelerate>=0.30",
    "safetensors>=0.4",
]
gliner = ["gliner>=0.2.9"]
# Needed by the evaluation/significance code under skillllm_v2.eval (not by the extraction API).
eval = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3", "pyyaml>=6.0.1"]
# Course recommendation (existing course pipeline) builds a networkx graph.
recommend = ["networkx>=3.0", "pyyaml>=6.0.1"]
# Optional Neo4j (Aura) graph backend; the local NetworkX graph needs only the `recommend` extra.
graph = ["neo4j>=5.20"]
test = ["pytest>=7.4"]

[project.scripts]
skillllm = "skillllm_v2.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["skillllm_v2*"]

[tool.setuptools.package-data]
skillllm_v2 = ["py.typed", "resources/*.jsonl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
