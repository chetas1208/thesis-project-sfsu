# Experiment 1 (SHORT PROMPT): identical to the v2 loop run (r=16, alpha 32, 400-doc dev, patience 3, max 6 rounds)
# except the compact prompt (prompt.version=short, ~41 fixed tokens instead of ~300) and a larger dev/probe
# generation batch (eval.batch_size 16, pure throughput; greedy decoding). Same seed -> same 400-doc dev subset as v2.
# Output schema and label set are unchanged. See docs/GPU_EXPERIMENTS_LOG.md.
seed: 42
run_id: qlora_loop_mistral24b_v3_shortprompt

prompt:
  version: short

model:
  model_path: models/mistral-small-3.1-24b-instruct-2503
  init_adapter_path: null
  use_4bit: true
  device_index: 0
  min_free_gb: 19.0
  attn_implementation: sdpa
  upcast_norms: false

data:
  train_file: data/skillllm_v2/mistral_sft/train.jsonl
  dev_file: data/skillllm_v2/mistral_sft/dev.jsonl
  limit_train: null
  limit_dev: null

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ".*language_model.*(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  micro_batch_size: 2
  grad_accum: 8
  learning_rate: 0.00015
  lr_decay_per_round: 0.85
  min_lr_ratio: 0.1
  warmup_ratio: 0.1
  weight_decay: 0.0
  max_grad_norm: 1.0
  max_seq_length: 768
  gradient_checkpointing: true
  optimizer: paged_adamw_8bit
  max_oom: 3
  log_every_steps: 5

loop:
  max_rounds: 6
  examples_per_round: 640
  hard_frac: 0.35
  max_repeat: 3
  empty_frac_start: 0.10
  empty_frac_end: 0.25
  patience: 3
  min_delta: 0.002
  baseline_eval: false
  force_continue: false

mining:
  probe_size: 192
  probe_empty_frac: 0.30
  recheck_max: 48
  hard_pool_max: 400
  min_score: 0.5
  error_weights: {missed: 1.0, spurious: 1.0, boundary: 0.75, label: 0.75}

eval:
  dev_size: 400
  dev_only_with_gold: true
  dev_empty_frac: 0.0
  batch_size: 16
  max_new_tokens: 384

budget:
  max_gpu_hours: 3.2         # experiment cap (v2 used 3.17 for the same 6 rounds); total project cap is 8 GPU-h
  max_train_tokens: 2500000
  num_gpus: 1
  max_charge_seconds_per_event: 120
  eval_reserve_frac: 0.10
  est_round_hours: 0.0

output:
  dir: artifacts/skillllm_v2/qlora_loop_v3_shortprompt
