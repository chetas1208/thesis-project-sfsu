[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-extraction-benchmark"
version = "0.1.0"
description = "Reproducible benchmark comparing 5 skill-extraction models on SkillSpan"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
