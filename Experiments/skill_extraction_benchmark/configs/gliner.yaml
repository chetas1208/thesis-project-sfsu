# ─────────────────────────────────────────────────────────────────────
# GLiNER: Generalist Lightweight NER
# ─────────────────────────────────────────────────────────────────────

base_model: "urchade/gliner_medium-v2.1"

training:
  num_steps: 10000
  train_batch_size: 8
  eval_every: 500
  lr_encoder: 1.0e-5
  lr_others: 5.0e-5
  warmup_ratio: 0.1
  weight_decay_encoder: 0.1
  weight_decay_other: 0.01
  max_grad_norm: 10.0
  scheduler_type: "cosine"
  save_total_limit: 3

model:
  max_width: 12
  max_len: 384
  max_neg_type_ratio: 1
  max_types: 16
  subtoken_pooling: "first"
  span_mode: "markerV0"

inference:
  threshold: 0.5
  entity_types:
    - "skill"
